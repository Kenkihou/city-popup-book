<text x="8" y="406.8" >gml:id bldg_47f88f29-94bf-4cf9-8b1f-e5ddc674d930　北緯 35.0116209　東経 135.7681164</text>
<text x="8" y="410.2" >出典：国土交通省 Project PLATEAU 3D都市モデル（建築物 LOD2）を単純化　2026-10-27</text>
<text x="8" y="413.6" >組み立て：実線を切る → 背を谷折り → 各帯を、台紙との折り（谷）・段鼻（山）・踏み面の奥（谷）の順に折る → 90° に開いて立たせる。</text>
<text x="8" y="417" >山谷はこの面が表（立ち上がって見える面）のときのもの。裏面に印刷して折るなら山谷を入れ替え、左右を反転する。点線の階段は立て紙に吸収した奥側の輪郭（参考）。</text>
